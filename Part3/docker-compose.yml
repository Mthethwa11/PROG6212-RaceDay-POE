# Starts the RaceDay MVC web app in a container with ONE command (run from the repository root):
#
#   docker compose -f Part3/docker-compose.yml up --build
#
# The app is then at http://localhost:8080
# The Part 2 API must already be running on the host (https://localhost:7297).
services:
  raceday-web:
    build:
      context: ./RaceDay.Web
    image: raceday-web
    container_name: raceday-web
    ports:
      - "8080:8080"
    environment:
      # How the container reaches the API running on the host PC
      Api__BaseUrl: "https://host.docker.internal:7297"
      # The API uses the local ASP.NET development certificate, which a container does not trust.
      # This is for local demo use only and is OFF by default in appsettings.json.
      Api__AllowUntrustedCertificate: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
